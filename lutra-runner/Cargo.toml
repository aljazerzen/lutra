[package]
name = "lutra-runner"
description = "Runner abstraction for executing Lutra programs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.6.0"

[features]
std = ["lutra-bin/std", "tracing/std", "lutra-bin-stream?/std"]
async = ["std"]
binary-tokio = ["tokio", "std", "dep:tracing", "lutra-bin-stream/tokio", "lutra-bin-stream/compression-zstd"]
binary-embedded = ["embedded-io-async", "lutra-bin-stream/async"]
channel = ["tokio", "std"]
sync = ["tokio", "tokio/rt", "std"]

[dependencies]
embedded-io-async = { version = "0.7.0", optional = true }
lutra-bin = { workspace = true, default-features = false }
lutra-bin-stream = { workspace = true, optional = true }
tokio = { version = "1.46.1", features = ["io-util", "sync"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.46.1", features = ["macros", "rt", "time"] }

[build-dependencies]
lutra-codegen = { workspace = true }
